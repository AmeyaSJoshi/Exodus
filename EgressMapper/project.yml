name: EgressMapper
options:
  bundleIdPrefix: com.egress
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.28.0

targets:
  EgressMapper:
    type: application
    platform: iOS
    sources:
      - Sources/EgressMapper
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MapLibre
        product: MapLibre
    info:
      path: Sources/EgressMapper/Info.plist
      properties:
        CFBundleDisplayName: EGRESS Mapper
        UILaunchScreen: {}
        NSCameraUsageDescription: EGRESS Mapper uses the camera for AR indoor mapping and navigation. Camera frames are processed on device and are never uploaded.
        NSPhotoLibraryUsageDescription: Import a floor plan image to align with a recorded route.
        NSMicrophoneUsageDescription: EGRESS Mapper listens only while you hold the voice-report button, so you can report a blocked route without typing.
        NSSpeechRecognitionUsageDescription: Spoken reports are converted to text on device to understand phrases like "the hallway ahead is blocked".
        NSLocalNetworkUsageDescription: EGRESS Mapper connects to the local Supabase instance on your Mac during development.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egress.mapper.sp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AYZ8S57X7F
  EgressMapperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EgressMapperTests
    dependencies:
      - target: EgressMapper
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EgressMapper.app/EgressMapper
        BUNDLE_LOADER: $(TEST_HOST)
